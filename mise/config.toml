[tools]
# Node LTS still ships npm 11; Vite+ pins npm 12.0.2 via devEngines. Keep this
# first so `npm`/`npx` resolve to 12 even when mise prepends node onto PATH.
"npm:npm" = "12.0.2"
python = "3.14"
ruby = "3.4"
node = "lts"
go = "1.25"
rust = "1.90"
deno = "latest"
bun = "1.3"
"npm:pnpm" = "latest"
